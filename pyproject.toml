[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sdscratch"
version = "0.1.0"
description = "Stable Diffusion (SD 1.5 + SDXL) implemented from scratch in PyTorch: UNet, VAE, CLIP, tokenizer, DDPM/DDIM/DPM-Solver samplers, and memory optimizations for 1024x1024 on consumer GPUs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Qui Pham" }]
dependencies = [
    "torch>=2.1",
    "numpy",
    "safetensors",
    "huggingface_hub",
    "pillow",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "regex"]
parity = ["diffusers", "transformers", "accelerate"]

[tool.setuptools.packages.find]
include = ["sdscratch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
